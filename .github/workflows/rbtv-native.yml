name: Native RBTV protocol and UI checks

on:
  push:
    paths:
      - "src/**"
      - "app/assets/**"
      - "CMakeLists.txt"
      - "tests/**"
      - "BUILDING.md"
      - ".github/workflows/rbtv-native.yml"
  pull_request:
    paths:
      - "src/**"
      - "app/assets/**"
      - "CMakeLists.txt"
      - "tests/**"
      - "BUILDING.md"
      - ".github/workflows/rbtv-native.yml"

permissions:
  contents: read

jobs:
  protocol-tests:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install protocol test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y g++ pkg-config libcurl4-openssl-dev
      - name: Validate RBTV+ package metadata
        run: python3 tools/validate-app-metadata.py app/sce_sys/param.json
      - name: Run offline RBTV protocol tests
        run: python3 tests/run_rbtv_tests.py
      - name: Run native HTTP transport regressions
        run: python3 tests/run_addon_protocol_tests.py

  desktop-build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install native UI host-build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake pkg-config \
            libsdl2-dev libfreetype-dev libcurl4-openssl-dev libssl-dev zlib1g-dev \
            libavformat-dev libavcodec-dev libavutil-dev libswscale-dev libswresample-dev \
            libwebp-dev libfribidi-dev libegl-dev libgl-dev libgl1-mesa-dri ffmpeg
      - name: Configure desktop build
        run: cmake -S . -B build/desktop-ci -DCMAKE_BUILD_TYPE=Debug -DCMAKE_GENERATOR="Unix Makefiles"
      - name: Compile native UI and RBTV integration
        run: cmake --build build/desktop-ci --parallel 2
